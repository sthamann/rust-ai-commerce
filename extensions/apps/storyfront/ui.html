<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;padding:26px;font:15px system-ui;color:#18324d;background:#f6f9fd}h2{margin:8px 0 12px;font-size:26px}p{max-width:640px;line-height:1.6;color:#52687f}.tag{font-size:11px;letter-spacing:.14em;color:#0088ff}button,a{display:inline-flex;padding:12px 18px;border:1px solid #d3e1ef;border-radius:10px;background:white;color:#16334f;text-decoration:none;font:inherit;cursor:pointer}button.primary{background:#0088ff;color:white;border-color:#0088ff}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap}#status{min-height:26px}a[hidden]{display:none}</style>
<span class="tag">COMMERCE + STORYFRONT</span><h2 id="heading"></h2><p id="intro"></p><div class="actions"><button id="generate" class="primary"></button><button id="refresh"></button><a id="open" target="_blank" rel="noopener" hidden></a></div><p id="status" role="status" aria-live="polite"></p><p id="checkout"></p>
<script type="module">
import {connectCommerce} from '/sdk.js';const sdk=await connectCommerce();
const copy={en:['Your shop, told as a story','Generate a Storyfront from your catalog, variants, images and specifications. Rust Commerce confirms prices, shipping, tax and payment methods at checkout.','Generate / refresh shop','Check status','Open shop','Not generated yet','Generating your shop...','Shop ready','Generation failed. Check the connector configuration.','The shop uses your actual commerce catalog. Generating it does not create an order or charge a payment.','products','images'],de:['Dein Shop als Erlebnis','Erzeuge einen Storyfront aus deinem Katalog, Varianten, Bildern und Eigenschaften. Rust Commerce bestätigt im Checkout Preise, Versand, Steuern und Zahlungsarten.','Shop erzeugen / aktualisieren','Status prüfen','Shop öffnen','Noch nicht erzeugt','Dein Shop wird erzeugt...','Shop bereit','Erzeugung fehlgeschlagen. Prüfe die Connector-Konfiguration.','Der Shop verwendet deinen Commerce-Katalog. Die Erzeugung löst keine Bestellung und keine Zahlung aus.','Produkte','Bilder'],fr:['Votre boutique en récit','Créez un Storyfront avec votre catalogue, variantes, images et caractéristiques. Rust Commerce confirme les prix, la livraison, les taxes et le paiement.','Créer / actualiser','Vérifier le statut','Ouvrir la boutique','Pas encore créé','Création en cours...','Boutique prête','Échec de création. Vérifiez le connecteur.','La création utilise votre catalogue et ne crée ni commande ni paiement.','produits','images'],es:['Tu tienda como experiencia','Crea un Storyfront con tu catálogo, variantes, imágenes y propiedades. Rust Commerce confirma precios, envío, impuestos y pagos.','Crear / actualizar','Consultar estado','Abrir tienda','Aún no creada','Creando tienda...','Tienda preparada','No se pudo crear. Revisa el conector.','La creación utiliza tu catálogo y no genera pedidos ni cargos.','productos','imágenes']}[sdk.locale.slice(0,2)]??[];
const q=id=>document.getElementById(id);q('heading').textContent=copy[0];q('intro').textContent=copy[1];q('generate').textContent=copy[2];q('refresh').textContent=copy[3];q('open').textContent=copy[4];q('checkout').textContent=copy[9];let timer;
async function status(){try{const v=await sdk.action('status');q('status').textContent=v.state==='ready'?`${copy[7]} · ${v.products} ${copy[10]} · ${v.images} ${copy[11]}`:v.state==='failed'?copy[8]:['queued','running'].includes(v.state)?copy[6]:copy[5];q('generate').disabled=['queued','running'].includes(v.state);q('open').hidden=v.state!=='ready';if(v.state==='ready'){const u=new URL(v.storefrontUrl);if(['https:','http:'].includes(u.protocol))q('open').href=u.href;}clearTimeout(timer);if(['queued','running'].includes(v.state))timer=setTimeout(status,1800);}catch(e){q('status').textContent=e.message;}}
q('generate').onclick=async()=>{q('generate').disabled=true;try{await sdk.action('generate');await status();}catch(e){q('status').textContent=e.message;q('generate').disabled=false;}};q('refresh').onclick=status;await status();
</script></html>
