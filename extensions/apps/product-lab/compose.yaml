# From repository root; supply APP_TOKEN privately and proxy this loopback UI through HTTPS for public hosting.
services:
  product-lab:
    build:
      context: ../../..
      dockerfile: extensions/apps/product-lab/Dockerfile
    environment:
      APP_TOKEN: ${APP_TOKEN:?private app gateway token required}
    ports: ["127.0.0.1:8798:8798"]
    volumes: ["product-lab-data:/state"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
volumes:
  product-lab-data:
