[package]
name = "vendune"
version = "0.5.0"
edition = "2024"
license-file = "LICENSE"
description = "Experimental AI-native commerce and Shopware migration laboratory"

[dependencies]
aes-gcm = "0.10.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
axum = { version = "0.8.9", features = ["multipart"] }
pdf-extract = "0.12.1"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
sha2 = "0.10"
hmac = "0.12"
cron = "0.17"
argon2 = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = { version = "49.0.1", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
