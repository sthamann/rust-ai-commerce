[package]
name = "vendune"
version = "0.5.0"
edition = "2024"
license-file = "LICENSE"
description = "Experimental AI-native commerce and Shopware migration laboratory"

[dependencies]
aes-gcm = "0.10.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
axum = { version = "0.8.9", features = ["multipart"] }
pdf-extract = "0.12.1"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "compression-br", "compression-gzip"] }
sha2 = "0.10"
hmac = "0.12"
cron = "0.17"
argon2 = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmtime = { version = "49.0.1", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
regex = "1"
futures-util = "0.3"
async-stream = "0.3.6"
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-pemfile = "2"
scraper = "0.24"

[profile.release]
lto = "thin"
codegen-units = 1
