name: Verify prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://commerce:ci-only-password@127.0.0.1:15487/commerce
      MERCHANT_TOKEN: ci-only-merchant-credential-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - name: Build open-source graph/vector database
        run: DB_PASSWORD=ci-only-password docker compose -p rust-ai-commerce up -d --build --wait postgres
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sodium, zip
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install connector cryptography dependency
        run: python3 -m pip install -r extensions/services/connectors/requirements.txt
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo build --locked --bins
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: proof
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Lean production contracts, source review locks and compiled conformance
        run: python3 scripts/formal.py
      - name: Reject broken policies, proof shortcuts and disconnected bindings
        run: python3 scripts/formal/mutations.py
      - name: Preserve formal verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-${{ github.sha }}
          path: artifacts/formal-*.json
          if-no-files-found: ignore
      - run: npm ci && npm run format:check && npm run build
        working-directory: frontend
      - run: composer install --working-dir=reference --no-interaction --prefer-dist
      - run: python3 scripts/differential.py && python3 scripts/context_differential.py && python3 scripts/delivery_differential.py && python3 scripts/rule_differential.py
      - name: Real database integration
        run: |
          trap 'cat /tmp/commerce.log' ERR
          target/debug/rust-ai-commerce > /tmp/commerce.log 2>&1 &
          commerce_pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/health && break || sleep 1; done
          python3 scripts/studio.py
          python3 scripts/integration.py
          python3 scripts/protocols.py
          python3 scripts/intelligence.py
          python3 scripts/commerce.py
          python3 scripts/scalability.py --container rust-ai-commerce-postgres-1
          python3 scripts/platform_setup.py
          python3 scripts/platform.py
          python3 scripts/users.py
          TEST_PERSONAL=1 python3 scripts/providers.py
          python3 scripts/apps.py
          python3 scripts/checkout_handoff.py
          python3 scripts/payments.py
          python3 scripts/services.py
          python3 scripts/extensions.py
          python3 scripts/staging.py
          python3 scripts/marketing_accounts.py
          python3 scripts/merchant_operations.py
          python3 scripts/customer_accounts.py
          python3 scripts/developer_documents.py
          kill "$commerce_pid"
          wait "$commerce_pid" || true
          python3 scripts/connector_store_tests.py
          python3 scripts/connected_apps.py
          node frontend/tests/analytics.mjs
          node frontend/tests/locales.mjs
          python3 scripts/structure.py
      # Real model checks are opt-in locally: CI does not replace them with a fake.
