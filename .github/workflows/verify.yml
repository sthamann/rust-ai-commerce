name: Verify prototype
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: commerce
        ports: ["15487:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://commerce:ci-only-password@127.0.0.1:15487/commerce
      MERCHANT_TOKEN: ci-only-merchant-credential-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, sodium, zip
          tools: composer:v2
      - run: cargo fmt --check && cargo test --locked && cargo build --locked
      - run: npm ci && npm run build
        working-directory: frontend
      - run: composer install --working-dir=reference --no-interaction --prefer-dist
      - run: python3 scripts/differential.py
      - name: Real database integration
        run: |
          target/debug/rust-ai-commerce > /tmp/commerce.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/health && break || sleep 1; done
          python3 scripts/integration.py
          python3 scripts/protocols.py
      # Real model checks are opt-in locally: CI does not replace them with a fake.
