name: Verify prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://commerce:ci-only-password@127.0.0.1:15487/commerce
      MERCHANT_TOKEN: ci-only-merchant-credential-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - name: Build open-source graph/vector database
        run: DB_PASSWORD=ci-only-password docker compose -p rust-ai-commerce up -d --build --wait postgres
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sodium, zip
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install connector cryptography dependency
        run: python3 -m pip install -r extensions/services/connectors/requirements.txt -r scripts/testing/requirements.txt
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings
      - name: Instrument the real Rust unit and HTTP paths
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          echo "CARGO_LLVM_COV_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
          CARGO_LLVM_COV_TARGET_DIR="$PWD/target" cargo llvm-cov clean --workspace
          CARGO_LLVM_COV_TARGET_DIR="$PWD/target" cargo llvm-cov show-env | python3 scripts/testing/coverage_env.py >> "$GITHUB_ENV"
      - run: cargo test --locked && cargo build --locked --bins
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: proof
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Lean production contracts, source review locks and compiled conformance
        run: python3 scripts/formal.py
      - name: Reject broken policies, proof shortcuts and disconnected bindings
        env:
          # Intentionally broken source variants must not inflate real-core coverage.
          LLVM_PROFILE_FILE: /tmp/commerce-mutation-%p-%m.profraw
        run: python3 scripts/formal/mutations.py
      - name: Preserve formal verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-${{ github.sha }}
          path: artifacts/formal-*.json
          if-no-files-found: ignore
      - run: npm ci && npm run format:check && npm run build && npm run architecture && npm run localization && npm run test:coverage
        working-directory: frontend
      - run: composer install --working-dir=reference --no-interaction --prefer-dist
      - run: python3 scripts/differential.py && python3 scripts/context_differential.py && python3 scripts/delivery_differential.py && python3 scripts/rule_differential.py && python3 scripts/automation_registry.py && python3 scripts/automation_differential.py
      - name: Real database and local provider integration (single suite registry)
        run: |
          COVERAGE_PROCESS_START="$PWD/scripts/testing/.coveragerc" PYTHONPATH="$PWD/scripts/testing" python3 scripts/verify_integration.py --existing-database --container rust-ai-commerce-postgres-1
      - name: Coverage reports and regression gates
        run: |
          mkdir -p artifacts/coverage
          cargo llvm-cov report --json --output-path artifacts/coverage/rust.json
          cargo llvm-cov report --html --output-dir artifacts/coverage/rust
          python3 -m coverage combine --rcfile=scripts/testing/.coveragerc
          python3 -m coverage json --rcfile=scripts/testing/.coveragerc
          python3 -m coverage html --rcfile=scripts/testing/.coveragerc
          python3 scripts/testing/coverage_report.py
      - name: Preserve complete coverage reports, gaps and integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            frontend/coverage
            artifacts/coverage
            artifacts/integration-server.log
          if-no-files-found: warn
      # External model/payment/OAuth checks remain opt-in; these reports do not certify live credentials.
