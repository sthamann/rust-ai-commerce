services:
  postgres:
    build: ./database
    image: vendune-db:local
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: commerce
    ports:
      - "127.0.0.1:${DB_PORT:-15487}:5432"
    volumes:
      - commerce-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  commerce-data:
