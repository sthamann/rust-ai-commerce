services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: commerce
    ports:
      - "127.0.0.1:${DB_PORT:-15487}:5432"
    volumes:
      - commerce-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 2s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.16.3
    ports: ["127.0.0.1:${QDRANT_PORT:-16333}:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
volumes:
  qdrant-data:
  commerce-data:
