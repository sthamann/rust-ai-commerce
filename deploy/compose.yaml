# Run from repository root: docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --build
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_DB: commerce
    volumes: ["commerce-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.16.3
    volumes: ["qdrant-data:/qdrant/storage"]
    restart: unless-stopped
  migrate:
    image: vendune:${COMMERCE_IMAGE_TAG:-local}
    build: &commerce-build
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?migration owner URL required}
      BOOTSTRAP_MODE: migrate
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  provision-runtime:
    image: postgres:17-bookworm
    entrypoint: ["sh", "/provision-runtime.sh"]
    volumes: ["./sql/provision-runtime.sh:/provision-runtime.sh:ro"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?required}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?independent runtime password required}
      DB_CONNECTOR_PASSWORD: ${DB_CONNECTOR_PASSWORD:?independent connector password required}
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"
  commerce:
    image: vendune:${COMMERCE_IMAGE_TAG:-local}
    build: *commerce-build
    environment:
      DATABASE_URL: ${DATABASE_RUNTIME_URL:?non-owner runtime URL required}
      DATABASE_RUNTIME_URL: ${DATABASE_RUNTIME_URL:?non-owner runtime URL required}
      DB_RLS_REQUIRED: "true"
      BIND_ADDR: 0.0.0.0:8787
      BOOTSTRAP_MODE: serve
      DB_MAX_PROCESSES: ${DB_MAX_PROCESSES:-1}
      DB_CLUSTER_CONNECTION_BUDGET: ${DB_CLUSTER_CONNECTION_BUDGET:-80}
      DB_POOLER_MODE: ${DB_POOLER_MODE:-session}
      DATABASE_LISTENER_URL: ${DATABASE_LISTENER_URL:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-0}
      DB_POOL_WAIT_MS: ${DB_POOL_WAIT_MS:-5000}
      READ_CONTEXT_CACHE: ${READ_CONTEXT_CACHE:-true}
      SEED_DEMO: "false"
      ALLOW_PUBLIC_SIGNUP: "false"
      ALLOW_BOOTSTRAP_AUTH: "false"
      COMMERCE_PUBLIC_ORIGIN: https://${COMMERCE_DOMAIN:?public DNS name required}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.6:35b}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_SERVICES: ${APP_SERVICES:-{}}

    depends_on:
      provision-runtime: {condition: service_completed_successfully}
    restart: unless-stopped
  operator:
    profiles: [operator-setup]
    image: vendune:${COMMERCE_IMAGE_TAG:-local}
    build: *commerce-build
    command: ["/app/vendune", "--bootstrap-operator"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      BOOTSTRAP_MODE: migrate
      ALLOW_BOOTSTRAP_AUTH: "false"
      ALLOW_PUBLIC_SIGNUP: "false"
      SEED_DEMO: "false"
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?operator email required}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Platform operator}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  connectors:
    profiles: [connected-apps]
    build:
      context: ..
      dockerfile: extensions/services/connectors/Dockerfile
    environment:
      CONNECTOR_DATABASE_URL: ${CONNECTOR_DATABASE_URL:?dedicated non-owner connector URL required}
      DB_RLS_REQUIRED: "true"
      CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY:-}
      CONNECTOR_GATEWAY_TOKEN: ${CONNECTOR_GATEWAY_TOKEN:-}
      CONNECTOR_PUBLIC_URL: https://${COMMERCE_DOMAIN}/connected-apps
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      EMAIL_SMTP_HOSTS: ${EMAIL_SMTP_HOSTS:-}
    depends_on:
      provision-runtime: {condition: service_completed_successfully}
    restart: unless-stopped
  gateway:
    image: caddy:2
    environment:
      COMMERCE_DOMAIN: ${COMMERCE_DOMAIN:?public DNS name required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [commerce]
    restart: unless-stopped
volumes:
  qdrant-data:
  commerce-data:
  caddy-data:
  caddy-config:
