<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc">
<title id="title">Multi-currency pricing from configuration to immutable order</title><desc id="desc">Shop rates and channel availability feed the server price resolver. Browser, API, MCP and UCP share one currency-bound cart. Orders and payment attempts freeze the financial snapshot.</desc>
<rect width="1080" height="400" rx="24" fill="#f3f6fc"/>
<g font-family="Arial,sans-serif" fill="#132342">
<text x="36" y="43" font-size="24" font-weight="700">One currency context. Every commerce surface.</text>
<g fill="white" stroke="#d6e1f5" stroke-width="2"><rect x="36" y="75" width="303" height="120" rx="16"/><rect x="390" y="75" width="303" height="120" rx="16"/><rect x="744" y="75" width="300" height="120" rx="16"/><rect x="180" y="248" width="305" height="118" rx="16"/><rect x="560" y="248" width="339" height="118" rx="16"/></g>
<g font-size="18" font-weight="700"><text x="57" y="105">Shop + sales channel</text><text x="412" y="105">Server price resolver</text><text x="765" y="105">Currency-bound cart</text><text x="202" y="278">Saved reference rates</text><text x="582" y="278">Immutable financial snapshot</text></g>
<g font-size="15"><text x="57" y="135">Base, default, allowed currencies</text><text x="57" y="164">Automatic or fixed product prices</text><text x="412" y="135">Integer FX → target precision</text><text x="412" y="164">Taxes, coupons, shipping, providers</text><text x="765" y="135">Storefront · API · MCP · UCP</text><text x="765" y="164">Revision + reviewed minor total</text><text x="202" y="309">Manual or dated ECB refresh</text><text x="202" y="338">No rate-provider call in checkout</text><text x="582" y="309">Order · payment · refund · invoice</text><text x="582" y="338">Currency, scale, rate and totals retained</text></g>
<g stroke="#2459ef" stroke-width="3" fill="none"><path d="M340 136h42m-8-6 8 6-8 6M694 136h42m-8-6 8 6-8 6M340 248v-25h201v-20m-6 8 6-8 6 8M894 195v24H735v21m-6-8 6 8 6-8"/></g>
</g></svg>
