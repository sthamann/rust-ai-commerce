<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 750" role="img" aria-labelledby="title description"><title id="title">One commerce core, several experiences</title><desc id="description">Storefront, Studio, MCP and UCP share the same admitted operations.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#71849d"/></marker></defs><rect width="1140" height="750" rx="24" fill="#f4f7fc"/><style>text{font-family:Inter,system-ui,sans-serif}.title{font-size:29px;font-weight:700;fill:#172b48}.sub{font-size:15px;fill:#60738c}.head{font-size:19px;font-weight:650;fill:#172b48}.line{font-size:14px;fill:#516781}.tag{font-size:12px;fill:#2163d8;font-weight:650}</style><text x="40" y="52" class="title">One commerce core, several experiences</text><text x="40" y="82" class="sub">Storefront, Studio, MCP and UCP share the same admitted operations.</text><path d="M200 225 L430 275" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M570 225 L570 275" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M940 225 L710 275" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M410 380 L280 440" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M730 380 L860 440" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M280 560 L430 610" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M860 560 L710 610" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="120" width="320" height="105" rx="15" fill="white" stroke="#d9e3f1"/><rect x="40" y="120" width="5" height="105" rx="2" fill="#2867ff"/><text x="62" y="153" class="head">Customer experiences</text><text x="62" y="181" class="line">Storefront / private Storyfront</text><text x="62" y="204" class="line">Catalog, account, cart, checkout</text><rect x="410" y="120" width="320" height="105" rx="15" fill="white" stroke="#d9e3f1"/><rect x="410" y="120" width="5" height="105" rx="2" fill="#2867ff"/><text x="432" y="153" class="head">Merchant + operators</text><text x="432" y="181" class="line">Studio, API clients, MCP tools</text><text x="432" y="204" class="line">Separate platform operator grant</text><rect x="780" y="120" width="320" height="105" rx="15" fill="white" stroke="#d9e3f1"/><rect x="780" y="120" width="5" height="105" rx="2" fill="#8761db"/><text x="802" y="153" class="head">Agentic channels</text><text x="802" y="181" class="line">MCP / UCP adapters</text><text x="802" y="204" class="line">Same permissions and checkout</text><rect x="210" y="275" width="720" height="105" rx="15" fill="white" stroke="#d9e3f1"/><rect x="210" y="275" width="5" height="105" rx="2" fill="#2867ff"/><text x="232" y="308" class="head">Admission → deterministic Rust operations</text><text x="232" y="336" class="line">Membership, customer capability, resource permits, tenant database scope</text><text x="232" y="359" class="line">Pricing · tax · rules/flows · stock · order/payment ledger</text><rect x="40" y="440" width="490" height="120" rx="15" fill="white" stroke="#d9e3f1"/><rect x="40" y="440" width="5" height="120" rx="2" fill="#2867ff"/><text x="62" y="473" class="head">PostgreSQL: authoritative state</text><text x="62" y="501" class="line">Tenant tables + scoped foreign keys + FORCE RLS</text><text x="62" y="524" class="line">Business mutation and outbox event commit together</text><text x="62" y="547" class="line">Migration credential is separate from runtime</text><rect x="610" y="440" width="490" height="120" rx="15" fill="white" stroke="#d9e3f1"/><rect x="610" y="440" width="5" height="120" rx="2" fill="#8761db"/><text x="632" y="473" class="head">Apps + private provider services</text><text x="632" y="501" class="line">Versioned manifest, rights, native views / isolated UI</text><text x="632" y="524" class="line">Leased jobs and verified external receipts</text><text x="632" y="547" class="line">No LLM or remote app writes paid/stock directly</text><rect x="260" y="610" width="620" height="80" rx="15" fill="white" stroke="#d9e3f1"/><rect x="260" y="610" width="5" height="80" rx="2" fill="#149b87"/><text x="282" y="643" class="head">Read models and grounded intelligence</text><text x="282" y="671" class="line">Outbox workers → graph, flows, app events, cache eviction</text><text x="40" y="725" class="sub">Vendune · executable boundaries first · private integrations stay separate</text></svg>