<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 680" role="img" aria-labelledby="title description"><title id="title">Shop memory is evidence, not automatic model training</title><desc id="description">Data and observations improve grounded context; deterministic commerce remains authoritative.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#71849d"/></marker></defs><rect width="1140" height="680" rx="24" fill="#f4f7fc"/><style>text{font-family:Inter,system-ui,sans-serif}.title{font-size:29px;font-weight:700;fill:#172b48}.sub{font-size:15px;fill:#60738c}.head{font-size:19px;font-weight:650;fill:#172b48}.line{font-size:14px;fill:#516781}.tag{font-size:12px;fill:#2163d8;font-weight:650}</style><text x="40" y="52" class="title">Shop memory is evidence, not automatic model training</text><text x="40" y="82" class="sub">Data and observations improve grounded context; deterministic commerce remains authoritative.</text><path d="M200 255 L380 315" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M570 255 L570 315" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M940 255 L760 315" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M380 425 L290 490" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M540 550 L600 550" stroke="#71849d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="120" width="320" height="135" rx="15" fill="white" stroke="#d9e3f1"/><rect x="40" y="120" width="5" height="135" rx="2" fill="#2867ff"/><text x="62" y="153" class="head">Products + knowledge</text><text x="62" y="181" class="line">Product fields and attachments</text><text x="62" y="204" class="line">Uploaded documents / connected data</text><text x="62" y="227" class="line">Tenant, provenance, publication rights</text><rect x="410" y="120" width="320" height="135" rx="15" fill="white" stroke="#d9e3f1"/><rect x="410" y="120" width="5" height="135" rx="2" fill="#2867ff"/><text x="432" y="153" class="head">Committed commerce events</text><text x="432" y="181" class="line">Placed orders / confirmed capture</text><text x="432" y="204" class="line">Event receipts deduplicate effects</text><text x="432" y="227" class="line">Simulated activity stays labelled</text><rect x="780" y="120" width="320" height="135" rx="15" fill="white" stroke="#d9e3f1"/><rect x="780" y="120" width="5" height="135" rx="2" fill="#2867ff"/><text x="802" y="153" class="head">Customer behavior</text><text x="802" y="181" class="line">Consented session exposures</text><text x="802" y="204" class="line">Rewarded purchase observations</text><text x="802" y="227" class="line">No demonstrated causal uplift</text><rect x="160" y="315" width="820" height="110" rx="15" fill="white" stroke="#d9e3f1"/><rect x="160" y="315" width="5" height="110" rx="2" fill="#149b87"/><text x="182" y="348" class="head">Transactional graph + separately indexed retrieval</text><text x="182" y="376" class="line">PostgreSQL stores relations, evidence and hypotheses; Qdrant finds candidate documents</text><text x="182" y="399" class="line">Tenant/model filters + current database hydration; vector search alone cannot grant access</text><rect x="40" y="490" width="500" height="125" rx="15" fill="white" stroke="#d9e3f1"/><rect x="40" y="490" width="5" height="125" rx="2" fill="#8761db"/><text x="62" y="523" class="head">Grounded assistant / product questions</text><text x="62" y="551" class="line">Bounded shop context → selected model provider</text><text x="62" y="574" class="line">Ollama / OpenAI / Anthropic configuration</text><text x="62" y="597" class="line">Responses and proposed changes require validation</text><rect x="600" y="490" width="500" height="125" rx="15" fill="white" stroke="#d9e3f1"/><rect x="600" y="490" width="5" height="125" rx="2" fill="#2867ff"/><text x="622" y="523" class="head">Merchant-reviewed action</text><text x="622" y="551" class="line">Expected revision + rights + deterministic operation</text><text x="622" y="574" class="line">Rules / flows / apps consume the committed result</text><text x="622" y="597" class="line">Model weights are not trained by these events</text><text x="40" y="655" class="sub">Vendune · executable boundaries first · private integrations stay separate</text></svg>