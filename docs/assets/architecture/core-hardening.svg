<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1116 427" role="img" aria-labelledby="title desc"><title id="title">Core hardening request and event path</title><desc id="desc">Trusted identity enters a scoped non-owner transaction; committed outbox work has bounded retries and retention. Configuration supplies shared capacity limits.</desc><rect width="1116" height="427" rx="20" fill="#f4f7fd"/><text x="32" y="37" font-family="sans-serif" font-weight="700" font-size="20" fill="#152641">One authority for identity, purchase and durable work</text><rect x="32" y="65" width="320" height="120" rx="14" fill="white" stroke="#b9cdf2"/><text x="50" y="93" font-family="sans-serif" font-size="17" font-weight="700" fill="#2459ef">Authenticated request</text><text x="50" y="119" font-family="sans-serif" font-size="13" fill="#334865">Typed Principal / current grants</text><text x="50" y="139" font-family="sans-serif" font-size="13" fill="#334865">Explicit route + method permission</text><text x="50" y="159" font-family="sans-serif" font-size="13" fill="#334865">Shared cluster admission lease</text><rect x="398" y="65" width="320" height="120" rx="14" fill="white" stroke="#b9cdf2"/><text x="416" y="93" font-family="sans-serif" font-size="17" font-weight="700" fill="#2459ef">Scoped database executor</text><text x="416" y="119" font-family="sans-serif" font-size="13" fill="#334865">Task context → BEGIN + SET LOCAL</text><text x="416" y="139" font-family="sans-serif" font-size="13" fill="#334865">FORCE RLS / non-owner role</text><text x="416" y="159" font-family="sans-serif" font-size="13" fill="#334865">Transaction or session pool</text><rect x="764" y="65" width="320" height="120" rx="14" fill="white" stroke="#b9cdf2"/><text x="782" y="93" font-family="sans-serif" font-size="17" font-weight="700" fill="#2459ef">Authoritative purchase</text><text x="782" y="119" font-family="sans-serif" font-size="13" fill="#334865">One cart/settings/stock transaction</text><text x="782" y="139" font-family="sans-serif" font-size="13" fill="#334865">No second pooled borrow under locks</text><text x="782" y="159" font-family="sans-serif" font-size="13" fill="#334865">Order + outbox commit together</text><rect x="32" y="270" width="320" height="115" rx="14" fill="white" stroke="#b9cdf2"/><text x="50" y="298" font-family="sans-serif" font-size="17" font-weight="700" fill="#2459ef">Configuration &amp; capacity</text><text x="50" y="324" font-family="sans-serif" font-size="13" fill="#334865">Separate migration owner</text><text x="50" y="344" font-family="sans-serif" font-size="13" fill="#334865">Runtime pool + listener budget</text><text x="50" y="364" font-family="sans-serif" font-size="13" fill="#334865">Frozen origins / provider contracts</text><rect x="398" y="270" width="320" height="115" rx="14" fill="white" stroke="#b9cdf2"/><text x="416" y="298" font-family="sans-serif" font-size="17" font-weight="700" fill="#2459ef">Committed work</text><text x="416" y="324" font-family="sans-serif" font-size="13" fill="#334865">LISTEN wake + durable fallback</text><text x="416" y="344" font-family="sans-serif" font-size="13" fill="#334865">Per-event savepoint / retries</text><text x="416" y="364" font-family="sans-serif" font-size="13" fill="#334865">Quarantine + scoped manual retry</text><rect x="764" y="270" width="320" height="115" rx="14" fill="white" stroke="#b9cdf2"/><text x="782" y="298" font-family="sans-serif" font-size="17" font-weight="700" fill="#2459ef">Bounded history</text><text x="782" y="324" font-family="sans-serif" font-size="13" fill="#334865">90d duplicate payload retirement</text><text x="782" y="344" font-family="sans-serif" font-size="13" fill="#334865">365d unreferenced metadata expiry</text><text x="782" y="364" font-family="sans-serif" font-size="13" fill="#334865">Preserve referenced evidence</text><path d="M352 126H390" fill="none" stroke="#2459ef" stroke-width="2" marker-end="url(#arrow)"/><path d="M718 126H756" fill="none" stroke="#2459ef" stroke-width="2" marker-end="url(#arrow)"/><path d="M924 185V227H558V262" fill="none" stroke="#2459ef" stroke-width="2" marker-end="url(#arrow)"/><path d="M352 326H390" fill="none" stroke="#2459ef" stroke-width="2" marker-end="url(#arrow)"/><path d="M718 326H756" fill="none" stroke="#2459ef" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2459ef"/></marker></defs><text x="32" y="409" font-family="sans-serif" font-size="12" fill="#526580">Notifications are hints. PostgreSQL state, current grants and locked purchase facts remain authoritative.</text></svg>
